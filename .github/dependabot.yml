version: 2

updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/backend"
      - "/frontend"
      - "/update-agent"
    target-branch: "dev"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
      - "/update-agent"
    target-branch: "dev"
    schedule:
      interval: "weekly"
