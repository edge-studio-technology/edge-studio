name: Suggest an improvement
description: Tell us how Edge Studio could work better for you.
title: "[Improvement] "
body:
  - type: markdown
    attributes:
      value: |
        Suggestions are public and do not promise delivery. Search existing issues first. For something broken, use Report a problem; for a new device or workflow, use the matching form.
        Do not share credentials, backups or personal information. Report security concerns through [SECURITY.md](https://github.com/edge-studio-technology/edge-studio/blob/main/SECURITY.md).
  - type: textarea
    id: problem
    attributes:
      label: What is difficult or missing?
      description: Describe the situation rather than needing to design a solution.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a better experience look like?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else that would help us understand?
      description: Optional examples or screenshots with sensitive details removed.
  - type: checkboxes
    id: public-report
    attributes:
      label: Before submitting
      options:
        - label: I understand this suggestion is public and have removed sensitive information.
          required: true
