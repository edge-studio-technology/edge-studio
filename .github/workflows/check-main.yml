name: Check (main)

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      - name: Check bcryptjs pin is current
        run: npm --prefix backend outdated bcryptjs || echo "::warning::bcryptjs has a newer release; review upstream and bump the pin"

      - run: npm run check
