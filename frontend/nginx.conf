server {
  listen 80;
  server_name _;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://raw.githubusercontent.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name _;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://raw.githubusercontent.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  ssl_certificate /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  root /usr/share/nginx/html;
  index index.html;

  # Re-resolve backend/update-agent DNS on each request instead of caching
  # the IP for the worker's lifetime (breaks after update-agent replaces a container).
  resolver 127.0.0.11 valid=10s;

  location = /api/integritas/stamp-file {
    client_max_body_size ${EDGE_STUDIO_UPLOAD_MAX_REQUEST_BYTES};
    include /etc/nginx/snippets/backend-proxy.conf;
  }

  location = /api/integritas/verify-proof-file {
    client_max_body_size ${EDGE_STUDIO_UPLOAD_MAX_REQUEST_BYTES};
    include /etc/nginx/snippets/backend-proxy.conf;
  }

  location = /api/minima/backups/restore {
    client_max_body_size ${EDGE_STUDIO_UPLOAD_MAX_REQUEST_BYTES};
    include /etc/nginx/snippets/backend-proxy.conf;
  }

  location /api/ {
    include /etc/nginx/snippets/backend-proxy.conf;
  }

  # Bare /update (no trailing slash) falls through to `location /` below —
  # it's the React SPA's own route. See docs/adr/0002-update-page-split.md.
  location /update/ {
    set $update_agent_upstream http://update-agent:8081;
    rewrite ^/update/(.*)$ /$1 break;
    proxy_pass $update_agent_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
